<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Invoice Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .invoice-box { max-width: 800px; margin: 50px auto; background: white; padding: 20px; border: 1px solid #ddd; }
        .company-logo { max-width: 100px; }
        .total { font-size: 20px; font-weight: bold; color: green; }
    </style>
</head>
<body>

<div class="container">
    <div class="invoice-box shadow p-4">
        <div class="text-center">
            <img src="https://via.placeholder.com/100" alt="Company Logo" class="company-logo">
            <h2 class="mt-2">Business Name</h2>
            <p class="text-muted">1234 Business Street, City, Country</p>
        </div>

        <table class="table mt-4">
            <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Description</th>
                    <th>Quantity</th>
                    <th>Unit Price</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Web Development Service</td>
                    <td>1</td>
                    <td>$500</td>
                    <td>$500</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>SEO Optimization</td>
                    <td>1</td>
                    <td>$200</td>
                    <td>$200</td>
                </tr>
            </tbody>
        </table>

        <div class="text-end">
            <p class="total">Total: $700</p>
        </div>
    </div>
</div>

</body>
</html>
