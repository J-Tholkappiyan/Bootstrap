<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee Directory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { transition: transform 0.3s; }
        .card:hover { transform: scale(1.05); }
        .employee-photo { width: 100px; height: 100px; border-radius: 50%; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center mt-4">🏢 Employee Directory</h2>

    <div class="row mt-4">
        <div class="col-md-4">
            <div class="card shadow p-3 text-center">
                <img src="https://via.placeholder.com/100" alt="Employee" class="employee-photo mx-auto">
                <h5 class="mt-2">John Doe</h5>
                <p class="text-muted">Software Engineer</p>
                <p><strong>Email:</strong> john@example.com</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow p-3 text-center">
                <img src="https://www.google.com/url?sa=i&url=https%3A%2F%2Fwww.aihr.com%2Fblog%2Femployee-life-cycle%2F&psig=AOvVaw2WIkgWwD7_5QH5aL6ZP4rA&ust=1740584117877000&source=images&cd=vfe&opi=89978449&ved=0CBQQjRxqFwoTCPjzl6WT34sDFQAAAAAdAAAAABAE" alt="Employee" class="employee-photo mx-auto">
                <h5 class="mt-2">Jane Smith</h5>
                <p class="text-muted">Marketing Manager</p>
                <p><strong>Email:</strong> jane@example.com</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow p-3 text-center">
                <img src="https://www.google.com/url?sa=i&url=https%3A%2F%2Fwww.aihr.com%2Fblog%2Femployee-life-cycle%2F&psig=AOvVaw2WIkgWwD7_5QH5aL6ZP4rA&ust=1740584117877000&source=images&cd=vfe&opi=89978449&ved=0CBQQjRxqFwoTCPjzl6WT34sDFQAAAAAdAAAAABAE" alt="Employee" class="employee-photo mx-auto">
                <h5 class="mt-2">David Lee</h5>
                <p class="text-muted">HR Specialist</p>
                <p><strong>Email:</strong> david@example.com</p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
