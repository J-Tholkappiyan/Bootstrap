<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Simple Interest Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="card p-4 shadow-lg">
        <h2 class="text-center">Simple Interest Calculator</h2>
        <form>
            <div class="mb-3">
                <input type="number" class="form-control" placeholder="Enter principal amount" step="0.01">
            </div>
            <div class="mb-3">
                <input type="number" class="form-control" placeholder="Enter rate of interest (%)" step="0.01">
            </div>
            <div class="mb-3">
                <input type="number" class="form-control" placeholder="Enter time (years)" step="0.1">
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-primary w-100">Calculate Interest</button>
            </div>
            <div class="alert alert-info mt-3 text-center" role="alert">
                Simple Interest will be displayed here.
            </div>
        </form>
    </div>
</body>
</html>
