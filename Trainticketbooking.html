<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketBooking Software</title>   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="card">
        <div class="card-header text-center">
            <h1>Train Ticket Booking</h1>
        </div>
        <div class="card-body">
            <form action="/submit_booking" method="POST">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="departure" class="form-label">Departure Station</label>
                        <input type="text" class="form-control" id="departure" name="departure" placeholder="Enter departure station" required>
                    </div>
        
                    <div class="col-md-6">
                        <label for="arrival" class="form-label">Arrival Station</label>
                        <input type="text" class="form-control" id="arrival" name="arrival" placeholder="Enter arrival station" required>
                    </div>
                </div>
                
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="travel_date" class="form-label">Travel Date</label>
                        <input type="date" class="form-control" id="travel_date" name="travel_date" required>
                    </div>
                    <div class="col-md-6">
                        <label for="class" class="form-label">Class</label>
                        <select class="form-select" id="class" name="class" required>
                            <option value="sleeper">Sleeper</option>
                            <option value="ac3">AC 3 Tier</option>
                            <option value="ac2">AC 2 Tier</option>
                            <option value="ac1">AC 1 Tier</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <!-- Number of Passengers -->
                    <div class="col-md-6">
                        <label for="passengers" class="form-label">Number of Passengers</label>
                        <input type="number" class="form-control" id="passengers" name="passengers" min="1" max="6" value="1" required>
                    </div>
                </div>
                
                <!-- Submit Button -->
                <div class="text-center">
                    <button type="submit" class="btn btn-primary">Book Ticket</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap JS (Optional) and Popper.js -->

</body>
</html>
